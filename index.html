<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BadgeMaster Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            animation: {
              'float-slow': 'float-slow 15s ease-in-out infinite',
              'float-delayed': 'float-delayed 18s ease-in-out infinite 2s',
              'float-reverse': 'float-reverse 20s ease-in-out infinite 1s',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.5s ease-out forwards',
              'zoom-in': 'zoomIn 0.3s ease-out forwards',
            },
            keyframes: {
              'float-slow': {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                '50%': { transform: 'translate(20px, -20px) scale(1.05)' },
              },
              'float-delayed': {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                '50%': { transform: 'translate(-20px, 20px) scale(1.05)' },
              },
              'float-reverse': {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                '50%': { transform: 'translate(15px, 15px) scale(0.95)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              zoomIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              }
            }
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.1"
  }
}
</script>
<style>
:root {
    --primary: #00f2fe;
    --secondary: #4facfe;
    --bg-dark: rgba(10, 10, 20, 0.85);
    --glass: rgba(255, 255, 255, 0.1);
    --neon-border: rgba(0, 242, 254, 0.5);
}

body {
    background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1b 100%) !important;
    color: #e0e0e0 !important;
    font-family: 'Inter', 'Segoe UI', sans-serif !important;
    backdrop-filter: blur(10px);
}

.neo-glass, button, input, .card, div[class*="container"] {
    background: var(--glass) !important;
    backdrop-filter: blur(15px) !important;
    border: 1px solid var(--neon-border) !important;
    border-radius: 12px !important;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
}

button:hover, .btn:hover {
    transform: scale(1.1) !important;
    background: var(--primary) !important;
    color: #000 !important;
    box-shadow: 0 0 20px var(--primary) !important;
}

button:active {
    transform: scale(0.95) !important;
}

* {
    transition: transform 0.3s ease, background 0.3s ease !important;
}
</style>
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 antialiased transition-colors duration-300">
    <div id="root"></div>
  </body>
</html>
